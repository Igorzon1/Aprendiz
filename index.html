<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2a2238" />
    <title>Jogo da Aprendiz</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #2a2238; }
      body { user-select: none; -webkit-user-select: none; touch-action: none; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; outline: none; }
      /* A UI monta seus próprios elementos aqui dentro (src/ui/ui.js). */
      #ui { position: fixed; inset: 0; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
